openapi: 3.0.3
info:
  title: Vine API
  version: 0.1.0
  description: |-
    The Vine developer API for collecting payments, creating checkout sessions, sending invoices and paying bills.

    ## Authentication
    Send `Authorization: Bearer <api key>` where `<api key>` is a live or test key from **Dashboard → Developers**.
    Use `sk_live_…` for real money and `sk_test_…` while integrating.

    API keys are scoped (`PAYMENT_LINKS`, `INVOICES`, `CHECKOUT`, `PRODUCTS`, `COURSES`, `BILLS`, `SIMS`, `KYC`) and mode-bound. `PAYMENTS` is the legacy broad payments scope. Only the endpoints in this reference are available to API keys.

    ## Amounts
    Monetary fields use **kobo** (100 kobo = ₦1). Example: ₦5,000 → `500000`.
servers:
  - url: https://api.vine.ng
    description: Production
tags:
  - name: System
    description: Health and status
  - name: Bills
    description: Bill categories, validation, and payments
  - name: Payment Links
    description: Shareable payment pages
  - name: Invoices
    description: Create, send, and collect on invoices
  - name: Checkout
    description: Hosted checkout sessions
  - name: Verifications
    description: BVN, NIN and CAC identity checks
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sk_live_ / sk_test_ API key
      description: API key from Dashboard → Developers.
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          description: Human readable error message.
        code:
          type: string
          description: Stable machine readable error code.
      required:
        - message
      example:
        message: Payment link not found
        code: NOT_FOUND
    Mode:
      type: string
      enum:
        - LIVE
        - TEST
      description: Key mode the request ran in.
      example: TEST
    Currency:
      type: string
      enum:
        - NGN
        - USD
        - GHS
        - KES
        - XOF
        - XAF
        - UGX
        - ZMW
        - TZS
        - RWF
      example: NGN
    AmountKobo:
      type: integer
      description: 'Amount in kobo (100 kobo = ₦1). Example: ₦5,000 = 500000.'
      example: 500000
    AmountKoboResponse:
      type: string
      description: Amount in kobo, returned as a string so large values keep full precision.
      example: '2500000'
    PaymentMethod:
      type: string
      enum:
        - bank_transfer
        - card
        - crypto
      example: bank_transfer
    PaymentStatus:
      type: string
      enum:
        - PENDING
        - SUCCESS
        - FAILED
        - EXPIRED
        - CANCELLED
      example: SUCCESS
    InvoiceStatus:
      type: string
      enum:
        - DRAFT
        - SENT
        - PAID
        - OVERDUE
        - CANCELLED
      example: SENT
    ApiKeyScope:
      type: string
      enum:
        - PAYMENTS
        - PAYMENT_LINKS
        - INVOICES
        - PRODUCTS
        - COURSES
        - BILLS
        - SIMS
        - CHECKOUT
        - KYC
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        service:
          type: string
          example: vine-api
        build:
          type: string
          description: Deployed build revision.
          example: '15'
        brand:
          type: string
          example: Vine
        tagline:
          type: string
          example: Financial Infrastructure for Africa
        redis:
          type: string
          enum:
            - connected
            - disconnected
        cache:
          type: string
          enum:
            - enabled
            - disabled
        redisError:
          type: string
          description: Only present when Redis is unreachable.
      required:
        - status
        - service
        - build
        - redis
        - cache
    BillCategory:
      type: object
      properties:
        id:
          type: string
          example: bcat_airtime
        slug:
          type: string
          enum:
            - ELECTRICITY
            - CABLE
            - AIRTIME
            - DATA
            - UTILITY
            - BETTING
          example: AIRTIME
        name:
          type: string
          example: Airtime
        provider:
          type: string
          description: Bill provider key.
        active:
          type: boolean
          example: true
      required:
        - id
        - slug
        - name
        - active
    BillProduct:
      type: object
      properties:
        id:
          type: string
          example: bprod_mtn
        categoryId:
          type: string
          example: bcat_airtime
        externalCode:
          type: string
          description: Pass this as `productCode` when verifying or paying.
          example: MTN
        name:
          type: string
          example: MTN
        minAmountKobo:
          type: string
          nullable: true
          description: Minimum amount in kobo, or null when the product sets the amount.
          example: '5000'
        maxAmountKobo:
          type: string
          nullable: true
          description: Maximum amount in kobo, or null when the product sets the amount.
          example: '5000000'
        active:
          type: boolean
          example: true
        category:
          $ref: '#/components/schemas/BillCategory'
      required:
        - id
        - categoryId
        - externalCode
        - name
        - active
    BillPaymentResult:
      type: object
      properties:
        paymentId:
          type: string
          example: bp_9f2c1a
        status:
          $ref: '#/components/schemas/PaymentStatus'
        provider:
          type: string
          description: Bill provider key that settled the payment.
        feeKobo:
          type: string
          description: Fee charged for the bill payment, in kobo.
          example: '10000'
        result:
          type: object
          additionalProperties: true
          description: Provider response for the vend. Shape varies by bill category.
      required:
        - paymentId
        - status
        - feeKobo
    PaymentLink:
      type: object
      properties:
        id:
          type: string
          example: clx8p2v0k0000qz7h9m1s2abc
        userId:
          type: string
          example: clx8p1r9x0000qz7h4b7t8xyz
        mode:
          $ref: '#/components/schemas/Mode'
        slug:
          type: string
          example: a1b2c3d4e5f6
        title:
          type: string
          example: Design retainer
        amountKobo:
          type: string
          nullable: true
          description: Fixed amount in kobo, or null when the payer chooses the amount.
          example: '2500000'
        allowCustomAmount:
          type: boolean
          example: false
        currency:
          $ref: '#/components/schemas/Currency'
        paymentMethods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'
          example:
            - bank_transfer
            - card
        active:
          type: boolean
          example: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
          example: '2026-05-01T09:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-05-01T09:00:00.000Z'
        payUrl:
          type: string
          format: uri
          description: Hosted payment page for this link. Share it with the payer.
          example: https://vine.ng/pay/a1b2c3d4e5f6
      required:
        - id
        - slug
        - title
        - allowCustomAmount
        - currency
        - active
        - payUrl
    PaymentLinkPayment:
      type: object
      properties:
        id:
          type: string
          example: plp_7d3e9f
        linkId:
          type: string
          example: clx8p2v0k0000qz7h9m1s2abc
        amountKobo:
          $ref: '#/components/schemas/AmountKoboResponse'
        payerEmail:
          type: string
          format: email
          nullable: true
          example: null
        method:
          $ref: '#/components/schemas/PaymentMethod'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        provider:
          type: string
          nullable: true
          description: Payment provider key.
        providerRef:
          type: string
          nullable: true
          example: nomba_9f2c1a
        createdAt:
          type: string
          format: date-time
          example: '2026-05-01T09:12:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-05-01T09:12:04.000Z'
      required:
        - id
        - linkId
        - amountKobo
        - method
        - status
    InvoiceLineItem:
      type: object
      required:
        - description
        - quantity
        - unitPriceKobo
      properties:
        description:
          type: string
          example: Brand identity design
        quantity:
          type: integer
          minimum: 1
          example: 1
        unitPriceKobo:
          $ref: '#/components/schemas/AmountKobo'
    InvoiceLineItemResponse:
      type: object
      properties:
        id:
          type: string
          example: ili_4b1c8d
        invoiceId:
          type: string
          example: inv_2c7f9a
        description:
          type: string
          example: Brand identity design
        quantity:
          type: integer
          example: 1
        unitPriceKobo:
          $ref: '#/components/schemas/AmountKoboResponse'
        amountKobo:
          type: string
          description: quantity multiplied by unitPriceKobo, in kobo.
          example: '2500000'
        sortOrder:
          type: integer
          example: 0
      required:
        - id
        - description
        - quantity
        - unitPriceKobo
        - amountKobo
    InvoicePayment:
      type: object
      properties:
        id:
          type: string
          example: inp_5e2a7c
        invoiceId:
          type: string
          example: inv_2c7f9a
        amountKobo:
          $ref: '#/components/schemas/AmountKoboResponse'
        payerEmail:
          type: string
          format: email
          nullable: true
          example: null
        method:
          $ref: '#/components/schemas/PaymentMethod'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        provider:
          type: string
          nullable: true
          description: Payment provider key.
        providerRef:
          type: string
          nullable: true
          example: nomba_5e2a7c
        createdAt:
          type: string
          format: date-time
          example: '2026-05-02T11:04:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-05-02T11:04:05.000Z'
      required:
        - id
        - invoiceId
        - amountKobo
        - method
        - status
    Invoice:
      type: object
      properties:
        id:
          type: string
          example: inv_2c7f9a
        userId:
          type: string
          example: clx8p1r9x0000qz7h4b7t8xyz
        mode:
          $ref: '#/components/schemas/Mode'
        invoiceNumber:
          type: string
          example: INV-2026-0001
        slug:
          type: string
          example: k3m9q2x7p1
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        clientName:
          type: string
          example: Ada Okafor
        clientEmail:
          type: string
          format: email
          example: ada@example.com
        clientPhone:
          type: string
          nullable: true
          example: '+2348012345678'
        clientAddress:
          type: string
          nullable: true
          example: 12 Marina, Lagos
        currency:
          $ref: '#/components/schemas/Currency'
        subtotalKobo:
          $ref: '#/components/schemas/AmountKoboResponse'
        taxKobo:
          type: string
          description: Tax in kobo.
          example: '187500'
        totalKobo:
          type: string
          description: subtotalKobo plus taxKobo, in kobo.
          example: '2687500'
        notes:
          type: string
          nullable: true
          example: Payable within 14 days.
        dueDate:
          type: string
          format: date-time
          nullable: true
          example: '2026-05-15T00:00:00.000Z'
        paymentMethods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'
          example:
            - bank_transfer
            - card
        sentAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-05-01T10:15:00.000Z'
        paidAt:
          type: string
          format: date-time
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
          example: '2026-05-01T10:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-05-01T10:15:00.000Z'
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLineItemResponse'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/InvoicePayment'
        payUrl:
          type: string
          format: uri
          description: Hosted invoice page. Share it with the client.
          example: https://vine.ng/invoice/k3m9q2x7p1
      required:
        - id
        - invoiceNumber
        - status
        - clientName
        - clientEmail
        - subtotalKobo
        - taxKobo
        - totalKobo
        - lineItems
        - payUrl
    KycVerification:
      type: object
      properties:
        id:
          type: string
          example: kycver_9f2c1a
        type:
          type: string
          enum:
            - BVN
            - NIN
            - CAC
          example: BVN
        status:
          type: string
          enum:
            - VERIFIED
            - NOT_VERIFIED
            - FAILED
          example: VERIFIED
        reference:
          type: string
          description: Masked BVN, NIN or company number.
          example: 221*****89
        responseCode:
          type: string
          nullable: true
          example: '00'
        detail:
          type: string
          nullable: true
          example: Verification successful
        feeKobo:
          type: string
          description: Fee charged for this check, in kobo.
          example: '10000'
        mode:
          $ref: '#/components/schemas/Mode'
        sandbox:
          type: boolean
          example: false
        data:
          type: object
          additionalProperties: true
          nullable: true
          description: Provider response for the check. Shape depends on the type.
        createdAt:
          type: string
          format: date-time
          example: '2026-10-29T10:00:00.000Z'
      required:
        - id
        - type
        - status
        - reference
        - feeKobo
        - mode
        - createdAt
    VerificationPricing:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/Mode'
        currency:
          type: string
          example: NGN
        pricing:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - BVN
                  - NIN
                  - CAC
              label:
                type: string
                example: BVN verification
              productType:
                type: string
                example: kyc_bvn
              feeKobo:
                type: string
                example: '10000'
              active:
                type: boolean
                example: true
            required:
              - type
              - label
              - productType
              - feeKobo
              - active
      required:
        - mode
        - currency
        - pricing
    CheckoutSession:
      type: object
      properties:
        id:
          type: string
          example: cs_9m4x2k
        amountKobo:
          $ref: '#/components/schemas/AmountKoboResponse'
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        mode:
          $ref: '#/components/schemas/Mode'
        type:
          type: string
          enum:
            - MERCHANT
            - SUBSCRIPTION
            - PAYMENT_LINK
            - DEPOSIT
            - COURSE
          example: MERCHANT
        checkoutUrl:
          type: string
          format: uri
          description: Redirect the customer here to pay.
          example: https://checkout.vine.ng/checkout/cs_9m4x2k
        expiresAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-05-01T11:30:00.000Z'
      required:
        - id
        - amountKobo
        - currency
        - status
        - mode
        - type
        - checkoutUrl
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Missing or invalid API key
            code: UNAUTHORIZED
    Forbidden:
      description: Insufficient scope or mode mismatch
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: API key is missing the INVOICES scope
            code: FORBIDDEN
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Payment link not found
            code: NOT_FOUND
paths:
  /health:
    get:
      tags:
        - System
      summary: Health check
      description: Liveness probe. Always responds 200, even when the cache is unreachable.
      responses:
        '200':
          description: API status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                service: vine-api
                build: '15'
                brand: Vine
                tagline: Financial Infrastructure for Africa
                redis: connected
                cache: enabled
  /v1/bills/categories:
    get:
      tags:
        - Bills
      summary: List bill categories
      description: Every bill category you can sell through the Bills API.
      responses:
        '200':
          description: Bill categories
          content:
            application/json:
              schema:
                type: object
                required:
                  - categories
                properties:
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/BillCategory'
              example:
                categories:
                  - id: bcat_airtime
                    slug: AIRTIME
                    name: Airtime
                    active: true
                  - id: bcat_data
                    slug: DATA
                    name: Data
                    active: true
                  - id: bcat_electricity
                    slug: ELECTRICITY
                    name: Electricity
                    active: true
                  - id: bcat_cable
                    slug: CABLE
                    name: Cable TV
                    active: true
                  - id: bcat_betting
                    slug: BETTING
                    name: Betting
                    active: true
  /v1/bills/products:
    get:
      tags:
        - Bills
      summary: List bill products
      description: Products for one category, or the whole catalog when `category` is omitted.
      parameters:
        - name: category
          in: query
          required: false
          description: Category slug, for example `AIRTIME`.
          schema:
            type: string
            enum:
              - ELECTRICITY
              - CABLE
              - AIRTIME
              - DATA
              - UTILITY
              - BETTING
      responses:
        '200':
          description: Bill products
          content:
            application/json:
              schema:
                type: object
                required:
                  - products
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/BillProduct'
              example:
                products:
                  - id: bprod_mtn
                    categoryId: bcat_airtime
                    externalCode: MTN
                    name: MTN
                    minAmountKobo: '5000'
                    maxAmountKobo: '5000000'
                    active: true
                    category:
                      id: bcat_airtime
                      slug: AIRTIME
                      name: Airtime
                      active: true
                  - id: bprod_mtn_1gb
                    categoryId: bcat_data
                    externalCode: svc_data|MTN-1GB-30D
                    name: MTN 1GB · 30 days
                    minAmountKobo: '50000'
                    maxAmountKobo: '50000'
                    active: true
                    category:
                      id: bcat_data
                      slug: DATA
                      name: Data
                      active: true
  /v1/bills/betting/providers:
    get:
      tags:
        - Bills
      summary: List betting providers
      description: Providers available for betting wallet top ups.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Betting providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  message:
                    type: string
              example:
                data:
                  - id: bet9ja
                    name: Bet9ja
                  - id: sportybet
                    name: SportyBet
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/bills/verify:
    post:
      tags:
        - Bills
      summary: Verify bill customer reference
      description: Confirms a customer, meter or betting account before you charge. Supported for electricity, cable, utility and betting.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - category
                - productCode
                - customerRef
              properties:
                category:
                  type: string
                  enum:
                    - ELECTRICITY
                    - CABLE
                    - UTILITY
                    - BETTING
                  example: ELECTRICITY
                productCode:
                  type: string
                  description: Product code from the catalog.
                  example: IKEDC
                customerRef:
                  type: string
                  description: Meter number, smartcard number or customer reference.
                  example: '04123456789'
            example:
              category: ELECTRICITY
              productCode: IKEDC
              customerRef: '04123456789'
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    type: object
                    additionalProperties: true
                    description: Resolved customer details. Shape depends on the bill category.
              example:
                result:
                  customerName: ADA OKAFOR
                  customerAddress: 12 MARINA, LAGOS
                  customerRef: '04123456789'
        '400':
          description: Unsupported category for verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Verify is only supported for electricity, cable, utility, and betting
                code: BAD_REQUEST
  /v1/bills/sync:
    post:
      tags:
        - Bills
      summary: Sync bill catalog from providers
      description: Refreshes the catalog from the bill provider. Safe to call on a schedule.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Catalog synced
          content:
            application/json:
              schema:
                type: object
                required:
                  - synced
                properties:
                  synced:
                    type: integer
                    description: Number of products written.
              example:
                synced: 128
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/bills/pay:
    post:
      tags:
        - Bills
      summary: Pay a bill
      description: Debits your wallet and vends the bill. Requires your 4 to 6 digit transaction PIN. Test mode returns a sandbox result without vending.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - category
                - productCode
                - customerRef
                - amountKobo
                - pin
              properties:
                category:
                  type: string
                  enum:
                    - ELECTRICITY
                    - CABLE
                    - AIRTIME
                    - DATA
                    - UTILITY
                    - BETTING
                  example: AIRTIME
                productCode:
                  type: string
                  example: MTN
                customerRef:
                  type: string
                  example: '08012345678'
                amountKobo:
                  $ref: '#/components/schemas/AmountKobo'
                bundleCode:
                  type: string
                  example: MTN-1GB-30D
                vendType:
                  type: string
                  example: PREPAID
                pin:
                  type: string
                  description: Transaction PIN (4-6 digits).
                  example: '1234'
            example:
              category: AIRTIME
              productCode: MTN
              customerRef: '08012345678'
              amountKobo: 100000
              pin: '1234'
      responses:
        '200':
          description: Bill paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillPaymentResult'
              example:
                paymentId: bp_9f2c1a
                status: SUCCESS
                feeKobo: '10000'
                result:
                  reference: VAS-8f21c
                  delivered: true
        '400':
          description: Invalid product or amount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: bundleCode required for data (use productCode as serviceCategoryId|bundleCode)
                code: BUNDLE_CODE_REQUIRED
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/verifications/pricing:
    get:
      tags:
        - Verifications
      summary: Get verification prices
      description: Prices charged per BVN, NIN or CAC check. Amounts are in kobo and match the key's mode.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Verification prices
          content:
            application/json:
