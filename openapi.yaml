              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/invoices/{id}/send:
    post:
      tags:
        - Invoices
      summary: Email invoice to client
      description: Marks the invoice as sent and emails the pay page. Omit the body to use the client details on the invoice.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Invoice id.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientEmail:
                  type: string
                  format: email
                  example: ada@example.com
                clientName:
                  type: string
                  example: Ada
            example:
              clientEmail: ada@example.com
              clientName: Ada
      responses:
        '200':
          description: Sent
          content:
            application/json:
              schema:
                type: object
                required:
                  - sent
                  - to
                  - payUrl
                  - status
                properties:
                  sent:
                    type: boolean
                  to:
                    type: string
                    format: email
                  payUrl:
                    type: string
                    format: uri
                  status:
                    $ref: '#/components/schemas/InvoiceStatus'
              example:
                sent: true
                to: ada@example.com
                payUrl: https://vine.ng/invoice/k3m9q2x7p1
                status: SENT
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Invoice already paid or cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invoice already paid
                code: INVOICE_PAID
  /v1/invoices/{id}/mark-paid:
    post:
      tags:
        - Invoices
      summary: Mark invoice paid manually
      description: Records an off-platform payment and settles the invoice. Use this for cash or bank transfers you reconciled yourself.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Invoice id.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 500
                  description: Internal note about how the invoice was settled.
                  example: Bank transfer confirmed on 2 May
            example:
              note: Bank transfer confirmed on 2 May
      responses:
        '200':
          description: Marked paid
          content:
            application/json:
              schema:
                type: object
                required:
                  - paid
                  - invoiceId
                  - paymentId
                  - status
                properties:
                  paid:
                    type: boolean
                  invoiceId:
                    type: string
                  paymentId:
                    type: string
                  status:
                    $ref: '#/components/schemas/InvoiceStatus'
              example:
                paid: true
                invoiceId: inv_2c7f9a
                paymentId: inp_5e2a7c
                status: PAID
        '400':
          description: Invoice cannot be marked paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invoice cannot be marked as paid
                code: INVOICE_NOT_PAYABLE
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/invoices/{id}/cancel:
    post:
      tags:
        - Invoices
      summary: Cancel invoice
      description: Cancels an unpaid invoice. The pay page stops accepting payments.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Invoice id.
          schema:
            type: string
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                required:
                  - cancelled
                properties:
                  cancelled:
                    type: boolean
              example:
                cancelled: true
        '400':
          description: Invoice cannot be cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invoice cannot be cancelled
                code: BAD_REQUEST
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/checkout/sessions:
    post:
      tags:
        - Checkout
      summary: Create hosted checkout session
      description: Creates a session and returns a `checkoutUrl`. Redirect the customer there to pay.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amountKobo
              properties:
                amountKobo:
                  $ref: '#/components/schemas/AmountKobo'
                currency:
                  allOf:
                    - $ref: '#/components/schemas/Currency'
                  default: NGN
                  description: Defaults to NGN. Non NGN sessions only support card and crypto.
                customerEmail:
                  type: string
                  format: email
                  description: Used for the receipt.
                  example: customer@example.com
                paymentMethods:
                  type: array
                  items:
                    $ref: '#/components/schemas/PaymentMethod'
                  minItems: 1
                  maxItems: 3
                  description: Defaults to the methods enabled on your account.
                  example:
                    - bank_transfer
                    - card
                successUrl:
                  type: string
                  format: uri
                  example: https://example.com/thanks
                cancelUrl:
                  type: string
                  format: uri
                  example: https://example.com/cancelled
                webhookUrl:
                  type: string
                  format: uri
                  description: Per session webhook override.
                  example: https://example.com/webhooks/vine
                metadata:
                  type: object
                  additionalProperties: true
                  description: Your own data, stored with the session.
                  example:
                    orderId: ord_123
            example:
              amountKobo: 500000
              customerEmail: customer@example.com
              paymentMethods:
                - bank_transfer
                - card
              successUrl: https://example.com/thanks
              metadata:
                orderId: ord_123
      responses:
        '201':
          description: Session with checkoutUrl
          content:
            application/json:
              schema:
                type: object
                required:
                  - session
                  - mode
                properties:
                  session:
                    $ref: '#/components/schemas/CheckoutSession'
                  mode:
                    $ref: '#/components/schemas/Mode'
              example:
                session:
                  id: cs_9m4x2k
                  amountKobo: '500000'
                  currency: NGN
                  status: PENDING
                  mode: TEST
                  type: MERCHANT
                  checkoutUrl: https://checkout.vine.ng/checkout/cs_9m4x2k
                  expiresAt: '2026-05-01T11:30:00.000Z'
                mode: TEST
        '400':
          description: No payment method available for the currency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Choose card or crypto for international checkout
                code: NO_AVAILABLE_PAYMENT_METHODS
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/checkout/sessions/{id}:
    get:
      tags:
        - Checkout
      summary: Get checkout session
      description: Returns the session and its current payment status.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Checkout session id.
          schema:
            type: string
      responses:
        '200':
          description: Session detail
          content:
            application/json:
              schema:
                type: object
                required:
                  - session
                  - mode
                properties:
                  session:
                    $ref: '#/components/schemas/CheckoutSession'
                  mode:
                    $ref: '#/components/schemas/Mode'
              example:
                session:
                  id: cs_9m4x2k
                  amountKobo: '500000'
                  currency: NGN
                  status: SUCCESS
                  mode: TEST
                  type: MERCHANT
                  checkoutUrl: https://checkout.vine.ng/checkout/cs_9m4x2k
                  expiresAt: '2026-05-01T11:30:00.000Z'
                mode: TEST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
