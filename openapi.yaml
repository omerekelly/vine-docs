    post:
      tags:
        - Payment Links
      summary: Create payment link
      description: Creates a shareable payment page. Send either a fixed `amountKobo` or set `allowCustomAmount` so the payer chooses.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  maxLength: 200
                  description: Shown on the payment page.
                  example: Design retainer
                amountKobo:
                  allOf:
                    - $ref: '#/components/schemas/AmountKobo'
                  description: Fixed amount in kobo. Required unless `allowCustomAmount` is true.
                allowCustomAmount:
                  type: boolean
                  example: false
                paymentMethods:
                  type: array
                  items:
                    $ref: '#/components/schemas/PaymentMethod'
                  minItems: 1
                  maxItems: 3
                  description: Defaults to the methods enabled on your account.
                  example:
                    - bank_transfer
                    - card
                expiresAt:
                  type: string
                  format: date-time
                  description: When the link stops accepting payments.
                  example: '2026-06-01T00:00:00.000Z'
            example:
              title: Design retainer
              amountKobo: 2500000
              paymentMethods:
                - bank_transfer
                - card
      responses:
        '201':
          description: Link created
          content:
            application/json:
              schema:
                type: object
                required:
                  - link
                  - mode
                properties:
                  link:
                    $ref: '#/components/schemas/PaymentLink'
                  mode:
                    $ref: '#/components/schemas/Mode'
              example:
                link:
                  id: clx8p2v0k0000qz7h9m1s2abc
                  userId: clx8p1r9x0000qz7h4b7t8xyz
                  mode: TEST
                  slug: a1b2c3d4e5f6
                  title: Design retainer
                  amountKobo: '2500000'
                  allowCustomAmount: false
                  currency: NGN
                  paymentMethods:
                    - bank_transfer
                    - card
                  active: true
                  expiresAt: null
                  createdAt: '2026-05-01T09:00:00.000Z'
                  updatedAt: '2026-05-01T09:00:00.000Z'
                  payUrl: https://vine.ng/pay/a1b2c3d4e5f6
                mode: TEST
        '400':
          description: Missing amount or custom amount flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Provide amountKobo or set allowCustomAmount
                code: BAD_REQUEST
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
